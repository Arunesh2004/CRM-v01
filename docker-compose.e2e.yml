version: '3.8'

services:
  db-e2e:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: crm_app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: e2e_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_app_user -d e2e_db"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_e2e_data:
